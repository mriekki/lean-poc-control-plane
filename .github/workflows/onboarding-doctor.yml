name: Lean Onboarding Doctor

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  doctor:
    if: >-
      startsWith(github.event.issue.title, '[invite-lean] ') &&
      github.event.comment.body == '/lean-doctor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate doctor request
        id: doctor
        run: |
          python tools/invitation.py extract-doctor \
            --event "$GITHUB_EVENT_PATH" \
            --registry config/developers.json

      - name: Verify GitHub App installation
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.doctor.outputs.target_owner }}
          permission-contents: read

      - name: Verify public ChatGPT bootstrap contract
        id: contract
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/mriekki/lean-platform/main/"
          curl --fail --silent --show-error "${base}chatgpt/current.json" -o "$RUNNER_TEMP/current.json"
          python - "$RUNNER_TEMP/current.json" <<'PY'
          import hashlib
          import json
          import sys
          import urllib.request
          from pathlib import Path

          descriptor = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if descriptor.get("schemaVersion") != 1 or descriptor.get("channel") != "stable":
              raise SystemExit("Unsupported public Lean bootstrap descriptor")
          base = "https://raw.githubusercontent.com/mriekki/lean-platform/main/"
          for item in descriptor.get("documents", []):
              data = urllib.request.urlopen(base + item["path"], timeout=20).read()
              digest = hashlib.sha256(data).hexdigest()
              if digest != item["sha256"]:
                  raise SystemExit(f"Contract hash mismatch: {item['path']}")
          print(f"Lean ChatGPT contract v{descriptor['contractVersion']} verified")
          PY

      - name: Report onboarding readiness
        uses: actions/github-script@v7
        env:
          TARGET_OWNER: ${{ steps.doctor.outputs.target_owner }}
          APP_OK: ${{ steps.app-token.outcome }}
          CONTRACT_OK: ${{ steps.contract.outcome }}
        with:
          script: |
            const app = process.env.APP_OK === 'success';
            const contract = process.env.CONTRACT_OK === 'success';
            const ready = app && contract;
            const body = [
              'LEAN ONBOARDING CHECK',
              '',
              `✓ Developer registry: ACTIVE`,
              `${app ? '✓' : '✗'} GitHub App installation: ${app ? 'verified' : 'not verified'}`,
              `${contract ? '✓' : '✗'} Public ChatGPT bootstrap contract: ${contract ? 'verified' : 'unavailable or invalid'}`,
              '',
              ready
                ? 'READY FOR LEAN — configure the ChatGPT coding Project once, then start with `New POC: <idea>`.'
                : 'NOT READY — resolve the failed check(s), then run `/lean-doctor` again.',
              '',
              'Bootstrap entrypoint: https://github.com/mriekki/lean-platform/blob/main/chatgpt/START_HERE.md',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
