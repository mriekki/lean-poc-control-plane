name: Generate POC

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: poc-generation-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  generate:
    if: startsWith(github.event.issue.title, '[generate-poc] ')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public control plane
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate public request envelope
        id: request
        shell: bash
        run: |
          python tools/request.py extract \
            --event "$GITHUB_EVENT_PATH" \
            --allowed-owners config/allowed-owners.json

      - name: Create Bootstrap source installation token
        id: source-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: mriekki
          repositories: lean-poc-bootstrap
          permission-contents: read

      - name: Create target installation token
        id: target-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.request.outputs.target_owner }}
          repositories: ${{ steps.request.outputs.target_name }}
          permission-contents: write
          permission-workflows: write

      - name: Checkout accepted Bootstrap control plane
        uses: actions/checkout@v4
        with:
          repository: mriekki/lean-poc-bootstrap
          token: ${{ steps.source-token.outputs.token }}
          path: bootstrap
          fetch-depth: 1

      - name: Resolve accepted Bootstrap commit
        id: bootstrap
        shell: bash
        run: echo "sha=$(git -C bootstrap rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout private target seed
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.request.outputs.target_repository }}
          token: ${{ steps.target-token.outputs.token }}
          path: target
          fetch-depth: 0

      - name: Verify target is safe for first publication
        shell: bash
        run: |
          python bootstrap/tools/remote_generation.py preflight-target \
            --root target \
            --repository "${{ steps.request.outputs.target_repository }}"

      - name: Validate private approved manifest
        id: manifest
        shell: bash
        run: |
          python bootstrap/tools/remote_generation.py validate-manifest \
            --manifest target/POC_BOOTSTRAP.json \
            --request-author "${{ steps.request.outputs.request_author }}" \
            --expected-bootstrap-commit "${{ steps.bootstrap.outputs.sha }}" \
            --expected-target-repository "${{ steps.request.outputs.target_repository }}" \
            --expected-target-owner "${{ steps.request.outputs.target_owner }}" \
            --allowed-target-owner "${{ steps.request.outputs.target_owner }}"

      - name: Acquire exact Lean package artifact
        id: lean-package
        shell: bash
        env:
          LEAN_PACKAGE: ${{ steps.manifest.outputs.lean_package }}
          LEAN_VERSION: ${{ steps.manifest.outputs.lean_version }}
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/lean-package"
          pack_json="$RUNNER_TEMP/lean-pack.json"
          mkdir -p "$package_dir"

          npm pack "${LEAN_PACKAGE}@${LEAN_VERSION}" \
            --json \
            --ignore-scripts \
            --pack-destination "$package_dir" > "$pack_json"

          filename="$(node -e '
            const fs = require("fs");
            const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!Array.isArray(result) || result.length !== 1 || !result[0].filename) process.exit(2);
            process.stdout.write(result[0].filename);
          ' "$pack_json")"
          tarball="$package_dir/$filename"
          if [ ! -f "$tarball" ]; then
            echo "npm pack did not produce expected Lean tarball: $tarball" >&2
            exit 2
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Verify approved Lean package integrity
        shell: bash
        env:
          LEAN_TARBALL: ${{ steps.lean-package.outputs.tarball }}
          LEAN_INTEGRITY: ${{ steps.manifest.outputs.lean_integrity }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('bootstrap/tools').resolve()))
          import lean_package_generation

          lean_package_generation.verify_integrity(
              Path(os.environ['LEAN_TARBALL']),
              os.environ['LEAN_INTEGRITY'],
          )
          print('Lean package integrity verified')
          PY

      - name: Generate deterministic workspace
        shell: bash
        run: |
          set -euo pipefail
          python bootstrap/tools/generate_snapshot.py \
            --manifest target/POC_BOOTSTRAP.json \
            --output "$RUNNER_TEMP/generated" \
            --lean-tarball "${{ steps.lean-package.outputs.tarball }}"

      - name: Validate generated workspace
        shell: bash
        env:
          LEAN_PACKAGE: ${{ steps.manifest.outputs.lean_package }}
          LEAN_VERSION: ${{ steps.manifest.outputs.lean_version }}
          LEAN_PROFILE: ${{ steps.manifest.outputs.lean_profile }}
          LEAN_INTEGRITY: ${{ steps.manifest.outputs.lean_integrity }}
        run: |
          set -euo pipefail
          python -m compileall -q "$RUNNER_TEMP/generated/tools"
          python "$RUNNER_TEMP/generated/tools/lean-package/check-managed-baselines.py"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'generated'
          required = [
              'POC_BOOTSTRAP.json',
              'LEAN_BASELINE.json',
              'CORE_BASELINE.json',
              'DEPLOYMENT_BASELINE.json',
              'DEV_ENVIRONMENT.json',
              'SCAFFOLD_PLAN.json',
          ]
          documents = {}
          for name in required:
              documents[name] = json.loads((root / name).read_text(encoding='utf-8'))
              print('OK', name)

          manifest = documents['POC_BOOTSTRAP.json']
          approved = manifest['generation']['lean']
          expected = {
              'package': os.environ['LEAN_PACKAGE'],
              'version': os.environ['LEAN_VERSION'],
              'profile': os.environ['LEAN_PROFILE'],
              'integrity': os.environ['LEAN_INTEGRITY'],
          }
          if approved != expected:
              raise SystemExit(f'Generated manifest Lean provenance mismatch: expected {expected!r}, found {approved!r}')

          lean = documents['LEAN_BASELINE.json']
          for key in ('package', 'version', 'profile'):
              if lean.get(key) != expected[key]:
                  raise SystemExit(
                      f'LEAN_BASELINE.json {key} mismatch: expected {expected[key]!r}, found {lean.get(key)!r}'
                  )
          components = lean.get('components') or {}
          if set(components) != {'core', 'deployment'}:
              raise SystemExit(
                  f'greenfield-poc Lean baseline must contain core and deployment components; found {sorted(components)}'
              )
          PY

      - name: Publish generated baseline
        id: publish
        shell: bash
        env:
          PROJECT_SLUG: ${{ steps.manifest.outputs.project_slug }}
        run: |
          set -euo pipefail
          target="$GITHUB_WORKSPACE/target"
          generated="$RUNNER_TEMP/generated"

          target_branch="$(git -C "$target" branch --show-current)"
          if [ -z "$target_branch" ]; then
            echo "Unable to resolve target default branch." >&2
            exit 2
          fi

          find "$target" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$generated"/. "$target"/

          git -C "$target" config user.name "lean-poc-control-plane[bot]"
          git -C "$target" config user.email "noreply@github.com"
          git -C "$target" add -A
          python tools/check_staged_diff.py --root "$target"

          if git -C "$target" diff --cached --quiet; then
            echo "Generated publication produced no changes." >&2
            exit 2
          fi

          git -C "$target" commit -m "Generate ${PROJECT_SLUG} workspace baseline"
          git -C "$target" push origin "HEAD:${target_branch}"
          echo "commit=$(git -C "$target" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=$target_branch" >> "$GITHUB_OUTPUT"

      - name: Report successful generation
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TARGET_REPOSITORY: ${{ steps.request.outputs.target_repository }}
          TARGET_COMMIT: ${{ steps.publish.outputs.commit }}
          TARGET_BRANCH: ${{ steps.publish.outputs.branch }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Generation published to \`$TARGET_REPOSITORY\` on \`$TARGET_BRANCH\` at \`$TARGET_COMMIT\`. Verify target default-branch CI before local clone/setup acceptance."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Report failed generation
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Remote POC generation failed. No publication success is implied. Inspect this workflow run before retrying or modifying the target repository."
