name: Temporary Project terminology migration

on:
  push:
    branches:
      - feature/project-terminology-migration

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project-terminology-migration
          fetch-depth: 0
      - name: Apply deterministic active-namespace migration
        shell: python
        run: |
          import re
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          suffixes = {'.md', '.json', '.py', '.yml', '.yaml', '.txt'}
          skip = {
              'CHANGELOG.md',
              'tests/test_project_terminology.py',
              '.github/workflows/temporary-project-terminology-migration.yml',
          }
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          tracked = [item for item in tracked if item]

          def replace_words(text: str) -> str:
              text = re.sub(r'\bPOCs\b', 'Projects', text)
              text = re.sub(r'\bPOC\b', 'Project', text)
              text = re.sub(r'\bpocs\b', 'projects', text)
              text = re.sub(r'\bpoc\b', 'project', text)
              return text

          for relative in tracked:
              if relative in skip:
                  continue
              path = root / relative
              if not path.is_file() or path.suffix.lower() not in suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = replace_words(text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          for relative in sorted(tracked, key=lambda value: value.count('/'), reverse=True):
              if relative in skip:
                  continue
              new_relative = replace_words(relative)
              if new_relative == relative:
                  continue
              destination = root / new_relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(['git', 'mv', relative, new_relative], check=True)
      - name: Commit migration result
        shell: bash
        run: |
          git config user.name "Project Forge Migration"
          git config user.email "mriekki@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes needed."
            exit 0
          fi
          git commit -m "Migrate Control Plane active terminology to Project"
          git push origin HEAD:feature/project-terminology-migration
