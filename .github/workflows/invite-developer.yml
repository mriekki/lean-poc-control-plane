name: Invite Project Forge Builder

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  invite:
    if: startsWith(github.event.issue.title, '[invite-lean] ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate invitation
        id: invite
        run: |
          python tools/invitation.py extract-invite \
            --event "$GITHUB_EVENT_PATH" \
            --registry config/developers.json

      - name: Read invitation policy
        id: policy
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          policy = json.loads(Path('config/invitation-policy.json').read_text(encoding='utf-8'))
          print(f"expiry_days={policy['expiryDays']}")
          PY

      - name: Resolve Project Forge Builder app identity
        id: app-identity
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Publish Project Forge onboarding instructions
        uses: actions/github-script@v7
        env:
          TARGET_OWNER: ${{ steps.invite.outputs.target_owner }}
          EXPIRY_DAYS: ${{ steps.policy.outputs.expiry_days }}
          APP_SLUG: ${{ steps.app-identity.outputs.app-slug }}
        with:
          script: |
            const target = process.env.TARGET_OWNER;
            const expiry = process.env.EXPIRY_DAYS;
            const appUrl = `https://github.com/apps/${process.env.APP_SLUG}/installations/new`;
            const welcomeUrl =
              'https://github.com/mriekki/lean-platform/blob/main/WELCOME.md';
            const body = [
              `# Welcome to Project Forge`,
              ``,
              `@${target}, you've been invited as a **Project Builder**.`,
              ``,
              `## Activate your access`,
              ``,
              `**1. Install Project Forge Builder**`,
              ``,
              `Open the GitHub App and install/approve it for your GitHub account if needed: ${appUrl}`,
              ``,
              `For the simplest experience, allow it for all repositories. If it is already installed, do not remove or reinstall it just to continue.`,
              ``,
              `**2. Accept this invitation**`,
              ``,
              `While signed in as **@${target}**, add a new comment to this issue containing exactly:`,
              ``,
              '`/accept-lean`',
              ``,
              `Project Forge will verify the rest automatically. You do not need to configure the Control Plane, GitHub Actions, Bootstrap, or App credentials.`,
              ``,
              `Invitation window: **${expiry} days**. To decline instead, comment \`/decline-lean\`.`,
              ``,
              `More about Project Forge: ${welcomeUrl}`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  test-preview:
    if: startsWith(github.event.issue.title, '[test-invite-forge]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate self-test request
        id: test-invite
        run: |
          python tools/onboarding_test.py extract-invite \
            --event "$GITHUB_EVENT_PATH" \
            --registry config/developers.json

      - name: Read invitation policy
        id: test-policy
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          policy = json.loads(Path('config/invitation-policy.json').read_text(encoding='utf-8'))
          print(f"expiry_days={policy['expiryDays']}")
          PY

      - name: Resolve Project Forge Builder app identity
        id: test-app-identity
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Publish onboarding simulation and invitation message preview
        uses: actions/github-script@v7
        env:
          TARGET_OWNER: ${{ steps.test-invite.outputs.target_owner }}
          EXPIRY_DAYS: ${{ steps.test-policy.outputs.expiry_days }}
          APP_SLUG: ${{ steps.test-app-identity.outputs.app-slug }}
        with:
          script: |
            const target = process.env.TARGET_OWNER;
            const expiry = process.env.EXPIRY_DAYS;
            const issueUrl = context.payload.issue.html_url;
            const appUrl = `https://github.com/apps/${process.env.APP_SLUG}/installations/new`;
            const welcomeUrl =
              'https://github.com/mriekki/lean-platform/blob/main/WELCOME.md';
            const body = [
              '# Project Forge onboarding test',
              '',
              '**TEST MODE — no access or authorization will be granted or changed.**',
              '',
              `This issue lets @${target} rehearse the same short onboarding path a new Project Builder receives.`,
              '',
              '## Invitation message preview',
              '',
              '```text',
              `Hi ${target},`,
              '',
              `You've been invited to Project Forge.`,
              '',
              'Activate your access:',
              `1. Open your invitation issue: ${issueUrl}`,
              `2. Install/approve Project Forge Builder if needed: ${appUrl}`,
              '3. In the invitation issue, add a new comment containing exactly: /accept-lean',
              '',
              `More about Project Forge: ${welcomeUrl}`,
              '```',
              '',
              '## Simulate activation',
              '',
              `1. Open **Project Forge Builder**: ${appUrl}`,
              '',
              '   If it is already installed, do not remove or reinstall it for this test.',
              '',
              `2. While signed in as **@${target}**, add a new comment to this issue containing exactly:`,
              '',
              '`/accept-lean`',
              '',
              'The test verifies GitHub identity, App availability, and the public Project Forge contract. It does not change authorization, create a Project, deploy, or tear down anything.',
              '',
              `Test window: **${expiry} days**.`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
