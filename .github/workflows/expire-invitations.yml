name: Expire Project Forge Invitations

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: List open issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 200 \
            --json number,title,createdAt > "$RUNNER_TEMP/open-issues.json"

      - name: Resolve expired invitation issues
        run: |
          python tools/invitation.py list-expired \
            --issues "$RUNNER_TEMP/open-issues.json" \
            --policy config/invitation-policy.json > "$RUNNER_TEMP/expired-issues.txt"

      - name: Close expired invitations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r issue; do
            [ -z "$issue" ] && continue
            gh issue comment "$issue" \
              --repo "$GITHUB_REPOSITORY" \
              --body "PROJECT_FORGE INVITATION — EXPIRED\n\nThe configured claim window elapsed. No developer authorization was changed. Ask a Project Forge admin for a new invitation if access is still wanted."
            gh issue close "$issue" \
              --repo "$GITHUB_REPOSITORY" \
              --reason "not planned"
          done < "$RUNNER_TEMP/expired-issues.txt"
